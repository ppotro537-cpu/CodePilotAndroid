name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare project
        run: |
          ls -la
          if ls CodePilotAndroid-source-*.zip 1> /dev/null 2>&1; then
            unzip -o CodePilotAndroid-source-*.zip
          fi
          # Si el codigo esta en una subcarpeta, lo traemos a la raiz
          if [ ! -d app ] && [ -d CodePilotAndroid/app ]; then
            cp -r CodePilotAndroid/* .
          fi
          if [ ! -d app ] && ls -d */app 1> /dev/null 2>&1; then
            cp -r */app .
            cp -r */gradle* . 2>/dev/null || true
          fi
          ls -la
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodePilot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
